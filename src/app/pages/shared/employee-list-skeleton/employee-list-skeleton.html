<div class="skeleton-table">
  <div class="skeleton-header">

    @for (column of [1, 2, 3, 4, 5, 6, 7, 8]; track column) {
      <app-skeleton
        width="80px"
        height="14px"
      ></app-skeleton>
    }

  </div>

  @for (row of rows; track $index) {
    <div class="skeleton-row">
      <app-skeleton width="60px" />

      <app-skeleton width="140px" />

      <app-skeleton width="110px" />

      <app-skeleton width="200px" />

      <app-skeleton width="120px" />

      <app-skeleton width="70px" />

      <app-skeleton width="140px" />

      <app-skeleton width="100px" />
    </div>
  }
</div>
