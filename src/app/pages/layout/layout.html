<div class="app-shell" [ngClass]="isSidebarOpen ? '' : 'collapsed'">
  <aside class="app-sidebar">
    <div class="sidebar-top">
      <div class="brand-badge">EM</div>
      <div class="brand-text">
        <p class="brand-name">Employee Management</p>
      </div>

      <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" (click)="isSidebarOpen = !isSidebarOpen">
        <hugeicons-icon
          [icon]="isSidebarOpen ? leftArrowicon : rightArrowicon"
          [size]="24"
          [strokeWidth]="1.5"
        ></hugeicons-icon>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link active" routerLink="/admin/dashboard" title="Dashboard">
        <hugeicons-icon
          [icon]="dashboardIcon"
          [size]="24"
          [strokeWidth]="1.5"
        ></hugeicons-icon>
        <span class="nav-label">Dashboard</span>
      </a>
      <a class="nav-link" routerLink="/admin/employee-list" title="Employees">
        <hugeicons-icon
          [icon]="employeeIcon"
          [size]="24"
          [strokeWidth]="1.5"
        ></hugeicons-icon>
        <span class="nav-label">Employees</span>
      </a>
      <a class="nav-link" routerLink="/admin/projects" title="Projects">
        <hugeicons-icon
          [icon]="projectIcon"
          [size]="24"
          [strokeWidth]="1.5"
        ></hugeicons-icon>
        <span class="nav-label">Projects</span>
      </a>
      <a class="nav-link" routerLink="/admin/project-assignment" title="Assignments">
        <hugeicons-icon
          [icon]="assignmentIcon"
          [size]="24"
          [strokeWidth]="1.5"
        ></hugeicons-icon>
        <span class="nav-label">Assignments</span>
      </a>
      <a class="nav-link" routerLink="/admin/reports" title="Reports">
        <hugeicons-icon
          [icon]="reportIcon"
          [size]="24"
          [strokeWidth]="1.5"
        ></hugeicons-icon>
        <span class="nav-label">Reports</span>
      </a>
    </nav>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <!-- <div>
        <button class="theme-toggle" (click)="toggleTheme()">Switch Theme</button>
      </div> -->
      <div>
        <input type="checkbox" id="toggle-button" class="toggle-button" (click)="toggleTheme()">
        <label for="toggle-button" class="text">Switch Mode (light/dark)</label>
      </div>

      <div class="topbar-right">
        <div class="user-info">
          <div class="user-avatar">
            <hugeicons-icon
              [icon]="loggedUserData?.gender === 'male' ? maleIcon : femaleIcon"
              [size]="24"
              [strokeWidth]="1.5"
            ></hugeicons-icon>
          </div>
          <div class="user-details">
            <p class="user-name">{{ loggedUserData?.employeeName }}</p>
            <p class="user-role">{{ loggedUserData?.role }}</p>
          </div>
        </div>
        <button class="logout-btn" type="button" (click)="onLogOut()">Logout</button>
      </div>
    </header>

    <main class="page-content">
      <section class="page-hero">
        <h1>Welcome back</h1>
        <p>Manage employee records, approvals, and team information from one place.</p>
      </section>

      <section class="page-body">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>
